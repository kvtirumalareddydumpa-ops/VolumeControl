name: volume_dock
description: "Ad-free edge volume panel for phones with broken volume keys."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Draws a Flutter UI in a system overlay window above every other app.
  flutter_overlay_window: ^0.4.4

  # Per-stream volume on Android: media, ring, notification, alarm.
  flutter_volume_controller: ^2.0.2

  # Remembers which edge the handle sits on and how high.
  shared_preferences: ^2.2.0

  # Opens the "Do Not Disturb access" settings screen.
  android_intent_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
