name: Build Volume Dock APK

on:
  push:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project and add our files
        run: |
          flutter create --org com.yourname --platforms android --project-name volume_dock app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          cp AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
          rm -f app/test/widget_test.dart

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: volume-dock-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
